name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Générer le projet Xcode (verbose)
        run: xcodegen generate --spec project.yml 2>&1

      - name: Vérifier les fichiers générés
        run: |
          ls -la RadarMap.xcodeproj/ || echo "ERREUR: projet non généré"

      - name: Résoudre les packages SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project RadarMap.xcodeproj \
            -scheme RadarMap \
            -derivedDataPath build \
            2>&1

      - name: Compiler (Release, sans signature)
        run: |
          xcodebuild \
            -project RadarMap.xcodeproj \
            -scheme RadarMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            2>&1

      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RadarMap.app Payload/
          zip -r RadarMap-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: RadarMap-ipa
          path: RadarMap-unsigned.ipa
          retention-days: 30
