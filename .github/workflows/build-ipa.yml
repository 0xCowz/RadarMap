name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Retirer l'entitlement CarPlay (compte gratuit)
        run: sed -i '' '/carplay-driving-task/d' project.yml

      - name: Générer le projet Xcode
        run: xcodegen

      - name: Résoudre les packages SPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project RadarMap.xcodeproj \
            -scheme RadarMap

      - name: Compiler (Release, sans signature)
        run: |
          xcodebuild \
            -project RadarMap.xcodeproj \
            -scheme RadarMap \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RadarMap.app Payload/
          zip -r RadarMap-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: RadarMap-ipa
          path: RadarMap-unsigned.ipa
          retention-days: 30
