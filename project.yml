name: RadarMap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  RadarMap:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    assets: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.radarmap   # à remplacer par le vôtre
        DEVELOPMENT_TEAM: ""                              # votre Team ID Apple
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Radars
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Pour centrer la carte sur votre position et lister les radars proches."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    entitlements:
      path: RadarMap.entitlements
      properties:
        # Nécessite l'accord d'Apple (voir README). Supprimer cette ligne pour un test sans CarPlay.
        com.apple.developer.carplay-driving-task: true
