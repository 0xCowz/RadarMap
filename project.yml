name: RadarMap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: 6.31.0

targets:
  RadarMap:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: MapLibre
        product: MapLibre
    entitlements:
      path: RadarMap.entitlements
      properties:
        com.apple.developer.carplay-driving-task: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.radarmap
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Radars
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            api.lucasmrq.work:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: false
        NSLocationWhenInUseUsageDescription: "Pour centrer la carte sur votre position et lister les radars proches."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
